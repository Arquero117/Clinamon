  gasto_civil:          {bloque: M, tipo: flujo,    unidad: t/año,         rango: [0, 1.0e12], descripcion: Gasto civil pagado}
  # Ejército y guerra (M)
  ejercito:             {bloque: M, tipo: stock,    unidad: personas,      rango: [0, 1.0e8],  descripcion: Soldados en armas}
  reclutas:             {bloque: M, tipo: flujo,    unidad: personas/año,  rango: [0, 1.0e8],  descripcion: Reclutamiento}
  bajas_militares:      {bloque: M, tipo: flujo,    unidad: personas/año,  rango: [0, 1.0e8],  descripcion: Soldados muertos en combate}
