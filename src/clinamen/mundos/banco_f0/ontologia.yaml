# --------------------------------------------------------------------------------- fichas de mecanismo (§14.2)
x-evidencia: &prueba
  referencias: ["ninguna: mecanismo de prueba de ingeniería F0"]
  nota: "Sin evidencia histórica. Solo ejercita el motor. Los rivales y los tests de hindcast llegan en F2."

estado_inicial:
  ecuacion: "Muestreo independiente por entidad del prior de prueba (uniformes y lognormales acotadas)."
  lee: []
  escribe: [territorio, tierra_cultivada, poblacion, reservas, tecnologia, tasa_fiscal, capacidad_fiscal, tesoro, deuda,
            ejercito, elites, legitimidad, inestabilidad, urbanizacion, gobernante_edad, gobernante_fragilidad,
            gobernante_capacidad, gobernante_mandato, inmunidad, anomalia_clima, epidemia_mortalidad, rendimiento,
            suficiencia_alimentaria, salario_real, forzamiento_volcanico]
  parametros: [ini_terr_min, ini_terr_max, frac_cultivable, ini_ocup_min, ini_ocup_max, ha_por_persona, ini_tasa_min,
               ini_tasa_max, ini_cap_min, ini_cap_max, agr_y0, cons_necesidad, ini_res_min, ini_res_max, ini_tec_min,
               ini_tec_max, ini_tesoro_anios, ini_deuda_anios, mil_frac, el_ratio_ref, ini_leg_min, ini_leg_max,
               ini_inest_max, ini_urb_min, ini_urb_max, ini_gob_edad_min, ini_gob_edad_max, gob_frag_sigma,
               ini_mandato_max, ini_inm_max, clima_sigma, clima_rho]
  fuentes: [inicial]
  circuitos: {}
  evidencia: *prueba

mecanismos:
  forzamiento_volcanico:
    ecuacion: "F(t) = ρ_v F(t−1) + 1[u0 < p_v] · min(x_m u1^(−1/α_v), x_max)"
    lee: [forzamiento_volcanico]
    escribe: [erupcion, forzamiento_volcanico]
    parametros: [vol_p, vol_xm, vol_alfa, vol_max, vol_persistencia]
    fuentes: [volcan]
