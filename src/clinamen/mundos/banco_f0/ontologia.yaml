# Ontología del mundo de banco F0 (M1).
#
# Mundo de PRUEBA DE INGENIERÍA para la fase F0. No describe ninguna sociedad real.
# Todos los parámetros tienen procedencia «supuesto» y no deben usarse para inferir nada.
# Su tamaño reproduce la configuración del objetivo de rendimiento (§14.3):
# 30 entidades, 53 variables por entidad, 15 mecanismos.

nombre: banco_f0
descripcion: >
  Mundo sintético de 30 entidades en rejilla 5x6 con demografía malthusiana, agricultura con clima,
  comercio y migración por aristas, fiscalidad y deuda, ejército y guerra con bajas de cola pesada,
  élites y crisis interna, epidemias de cola pesada, gobernantes con tabla de vida de Gompertz,
  difusión técnica y forzamiento volcánico compartido entre mundos.
advertencia: "Mundo de prueba F0: sin evidencia histórica; parámetros supuestos; no usar para inferencia."

topologia: {tipo: rejilla, filas: 5, columnas: 6}

x-supuesto: &sup
  procedencia: supuesto
  referencia: "ninguna: supuesto de ingeniería del mundo de banco F0"
  invariante: true

# --------------------------------------------------------------------------------- variables
variables:
  # Demografía (M)
  poblacion:            {bloque: M, tipo: stock,    unidad: personas,      rango: [0, 1.0e9],  descripcion: Población total de la entidad}
  nacimientos:          {bloque: M, tipo: flujo,    unidad: personas/año,  rango: [0, 1.0e9],  descripcion: Nacimientos del año}
  muertes_ordinarias:   {bloque: M, tipo: flujo,    unidad: personas/año,  rango: [0, 1.0e9],  descripcion: Muertes por causas ordinarias}
  muertes_hambre:       {bloque: M, tipo: flujo,    unidad: personas/año,  rango: [0, 1.0e9],  descripcion: Muertes por insuficiencia alimentaria}
  muertes_epidemia:     {bloque: M, tipo: flujo,    unidad: personas/año,  rango: [0, 1.0e9],  descripcion: Muertes por epidemia}
  muertes_guerra:       {bloque: M, tipo: flujo,    unidad: personas/año,  rango: [0, 1.0e9],  descripcion: Muertes por guerra (militares y civiles)}
  inmigrantes:          {bloque: M, tipo: flujo,    unidad: personas/año,  rango: [0, 1.0e9],  descripcion: Llegadas desde entidades vecinas}
  emigrantes:           {bloque: M, tipo: flujo,    unidad: personas/año,  rango: [0, 1.0e9],  descripcion: Salidas hacia entidades vecinas}
  urbanizacion:         {bloque: M, tipo: estado,   unidad: fracción,      rango: [0, 1],      descripcion: Fracción urbana de la población}
  # Agricultura y grano (M)
  tierra_cultivada:     {bloque: M, tipo: estado,   unidad: ha,            rango: [0, 1.0e9],  descripcion: Superficie cultivada}
  rendimiento:          {bloque: M, tipo: derivada, unidad: t/ha,          rango: [0, 10],     descripcion: Rendimiento agrícola del año}
  produccion:           {bloque: M, tipo: flujo,    unidad: t/año,         rango: [0, 1.0e10], descripcion: Cosecha del año}
  reservas:             {bloque: M, tipo: stock,    unidad: t,             rango: [0, 1.0e11], descripcion: Reservas privadas de grano}
  consumo:              {bloque: M, tipo: flujo,    unidad: t/año,         rango: [0, 1.0e11], descripcion: Grano consumido}
  mermas:               {bloque: M, tipo: flujo,    unidad: t/año,         rango: [0, 1.0e11], descripcion: Grano perdido en almacenamiento}
  exportaciones:        {bloque: M, tipo: flujo,    unidad: t/año,         rango: [0, 1.0e11], descripcion: Grano enviado a vecinos}
  importaciones:        {bloque: M, tipo: flujo,    unidad: t/año,         rango: [0, 1.0e11], descripcion: Grano recibido de vecinos}
  suficiencia_alimentaria: {bloque: M, tipo: derivada, unidad: fracción,   rango: [0, 1],      descripcion: Consumo sobre necesidad}
