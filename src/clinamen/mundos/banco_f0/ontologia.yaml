# --------------------------------------------------------------------------------- fuentes de azar
# tiempo_identidad_anios: tiempo durante el que la fuente se comparte entre el mundo real y el
# alternativo, contado desde que los dos mundos divergen físicamente (§4.3, ADR-0002).
fuentes:
  inicial:
    familia: difusiva
    dominio: entidad
    ranuras: 18
    tiempo_identidad_anios: inf
    justificacion_identidad: "Estado inicial común a ambos brazos por construcción (consulta I parte de un mismo estado en t0)."
    descripcion: "Muestreo del estado inicial desde el prior de prueba F0."
  volcan:
    familia: salto_pesado
    dominio: global
    ranuras: 2
    tiempo_identidad_anios: inf
    indice_cola: {nominal: 1.5, intervalo: [1.2, 2.0]}
    justificacion_identidad: "Forzamiento volcánico: nada humano lo desacopla (§4.3)."
    eventos:
      - {nombre: erupcion,     ranura: 0, descripcion: "Hay erupción este año"}
      - {nombre: sin_erupcion, ranura: 0, descripcion: "No hay erupción este año"}
    descripcion: "Ocurrencia (ranura 0) y magnitud Pareto truncada (ranura 1) de erupciones."
  clima_interno:
    familia: difusiva
    dominio: entidad
    ranuras: 1
    tiempo_identidad_anios: 0.05
    inclinable: true
    justificacion_identidad: "Variabilidad interna de la atmósfera: caótica, se desacopla en semanas (Lorenz, 1969)."
    eventos:
      - {nombre: innovacion_adversa,    ranura: 0, descripcion: "La innovación climática del año cae bajo el cuantil Φ(−1)"}
      - {nombre: innovacion_no_adversa, ranura: 0, descripcion: "La innovación climática del año no cae bajo el cuantil Φ(−1)"}
    descripcion: "Innovación gaussiana de la anomalía climática regional."
  invencion:
    familia: salto_ligero
    dominio: entidad
    ranuras: 1
    tiempo_identidad_anios: 1
    justificacion_identidad: "Se comparte la tasa (estado); la identidad del inventor se re-sortea en un año (§4.3)."
    eventos:
      - {nombre: invencion,     ranura: 0, descripcion: "Hay un salto técnico este año"}
      - {nombre: sin_invencion, ranura: 0, descripcion: "No hay salto técnico este año"}
    descripcion: "Saltos de invención."
  vital:
    familia: difusiva
    dominio: entidad
    ranuras: 2
    tiempo_identidad_anios: 1
    inclinable: true
    justificacion_identidad: "Lotería genética y de cohortes: los concebidos tras un año son otros (A8)."
    descripcion: "Ruido agregado de natalidad (ranura 0) y mortalidad ordinaria (ranura 1)."
  epidemia:
    familia: salto_pesado
    dominio: entidad
    ranuras: 2
    tiempo_identidad_anios: 20
    indice_cola: {nominal: 1.4, intervalo: [1.0, 2.0]}
    justificacion_identidad: "Salto de patógenos: se comparte el reservorio, la fecha se re-sortea en décadas (§4.3)."
    eventos:
      - {nombre: brote,     ranura: 0, descripcion: "Comienza un brote este año"}
      - {nombre: sin_brote, ranura: 0, descripcion: "No comienza un brote este año"}
    descripcion: "Ocurrencia (ranura 0) y virulencia Pareto truncada (ranura 1) de brotes (Cirillo y Taleb, 2020)."
  muerte_gobernante:
    familia: salto_ligero
    dominio: entidad
    ranuras: 1
    tiempo_identidad_anios: 2
    justificacion_identidad: "Muerte de los vivos en t0: se comparte la fragilidad (estado), la exposición se re-sortea en años (§4.3)."
    eventos:
      - {nombre: muere,     ranura: 0, descripcion: "El gobernante muere este año"}
      - {nombre: sobrevive, ranura: 0, descripcion: "El gobernante sobrevive este año"}
    descripcion: "Muerte del gobernante con riesgo de Gompertz por fragilidad."
  sucesion:
    familia: salto_ligero
    dominio: entidad
    ranuras: 3
    tiempo_identidad_anios: 1
    justificacion_identidad: "Rasgos de un sucesor concebido tras el POD: otra persona (A8)."
    descripcion: "Edad (ranura 0), fragilidad (ranura 1) y capacidad (ranura 2) del sucesor."
  guerra:
    familia: salto_ligero
    dominio: arista
    ranuras: 1
    tiempo_identidad_anios: 1
    justificacion_identidad: "Decisión de actores vivos: compartida hasta que el POD alcanza su contexto (supuesto: un año)."
    eventos:
      - {nombre: estalla, ranura: 0, descripcion: "Estalla una guerra en la arista este año"}
      - {nombre: paz,     ranura: 0, descripcion: "No estalla guerra en la arista este año"}
    descripcion: "Estallido de guerra entre entidades vecinas."
  batalla:
    familia: salto_ligero
    dominio: arista
    ranuras: 1
    tiempo_identidad_anios: 0.05
    justificacion_identidad: "Desenlace de batalla: dependiente de tiempo atmosférico y microcontingencias (semanas)."
    eventos:
      - {nombre: gana_a, ranura: 0, descripcion: "Si hay guerra en la arista, gana el extremo a"}
      - {nombre: gana_b, ranura: 0, descripcion: "Si hay guerra en la arista, gana el extremo b"}
    descripcion: "Resultado de Lanchester estocástico con tasa base de sorpresas."
  batalla_magnitud:
    familia: salto_pesado
    dominio: arista
    ranuras: 1
    tiempo_identidad_anios: 0.05
    indice_cola: {nominal: 1.5, intervalo: [1.3, 2.0]}
    justificacion_identidad: "Tamaño del choque: microcontingencias de campaña (semanas)."
    descripcion: "Fracción de bajas Pareto truncada (Richardson, 1948; Clauset, 2018)."
  revuelta:
    familia: salto_pesado
    dominio: entidad
    ranuras: 2
    tiempo_identidad_anios: 0.05
    indice_cola: {nominal: 1.5, intervalo: [1.0, 2.0]}
    justificacion_identidad: "Cascada de umbral: disparada por sucesos locales de días o semanas."
    eventos:
      - {nombre: revuelta, ranura: 0, descripcion: "Estalla una revuelta este año"}
      - {nombre: calma,    ranura: 0, descripcion: "No estalla revuelta este año"}
    descripcion: "Ocurrencia (ranura 0) y tamaño Pareto truncado (ranura 1) de revueltas (Granovetter, 1978)."

# --------------------------------------------------------------------------------- identidades (A3)
identidades:
  poblacion:
    tipo: stock_flujo
    stock: poblacion
    entradas: [nacimientos, inmigrantes]
    salidas: [muertes_ordinarias, muertes_hambre, muertes_epidemia, muertes_guerra, emigrantes]
    descripcion: "Balance demográfico por entidad."
  migracion_global:
    tipo: conservacion_global
    izquierda: [inmigrantes]
    derecha: [emigrantes]
    descripcion: "Nadie aparece ni desaparece al migrar."
  grano:
    tipo: stock_flujo
    stock: reservas
    entradas: [produccion, importaciones]
    salidas: [ingresos_fiscales, exportaciones, consumo, mermas]
    descripcion: "Balance de grano privado."
  comercio_global:
    tipo: conservacion_global
    izquierda: [exportaciones]
    derecha: [importaciones]
    descripcion: "Todo grano exportado es importado por alguien."
  tesoro:
    tipo: stock_flujo
    stock: tesoro
    entradas: [ingresos_fiscales, prestamos]
    salidas: [gasto_militar, gasto_civil, intereses, amortizacion]
    descripcion: "Caja del Estado."
  deuda:
    tipo: stock_flujo
    stock: deuda
    entradas: [prestamos]
    salidas: [amortizacion, impago]
    descripcion: "Deuda pública."
  ejercito:
    tipo: stock_flujo
    stock: ejercito
    entradas: [reclutas]
    salidas: [bajas_militares, licenciados]
    descripcion: "Efectivos militares."
  elites:
    tipo: stock_flujo
    stock: elites
    entradas: [entrada_elites]
    salidas: [salida_elites]
    descripcion: "Número de élites."
  territorio:
    tipo: stock_flujo
    stock: territorio
    entradas: [territorio_ganado]
    salidas: [territorio_perdido]
    descripcion: "Territorio por entidad."
  territorio_global:
    tipo: stock_global_constante
    stock: territorio
    descripcion: "La superficie total no cambia."
  transferencias_territorio:
    tipo: conservacion_global
    izquierda: [territorio_ganado]
    derecha: [territorio_perdido]
    descripcion: "Lo que uno gana otro lo pierde."
  ejercito_en_poblacion:
    tipo: desigualdad
    menor: ejercito
    mayor: poblacion
    descripcion: "Los soldados son parte de la población."
  elites_en_poblacion:
    tipo: desigualdad
    menor: elites
    mayor: poblacion
    descripcion: "Las élites son parte de la población."
  bajas_en_muertes_guerra:
    tipo: desigualdad
    menor: bajas_militares
    mayor: muertes_guerra
    descripcion: "Las bajas militares son parte de las muertes de guerra."

